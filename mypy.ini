# Type checking for the Python prover. The repo has no pyproject.toml — it is
# built by bazel and cargo — so mypy's settings live here.
[mypy]
python_version = 3.11
files = python/accumulation_zorch
# Annotations are not required yet; turning these on is a typing pass of its own.
disallow_untyped_defs = False
disallow_incomplete_defs = False
# Off while annotations are optional: the existing `type: ignore` comments were
# written for the stricter setting and read as unused under this one. They come
# back into force with disallow_untyped_defs, so churning them out now would
# just mean putting them back.
warn_unused_ignores = False
warn_redundant_casts = True

# Untyped or statically unresolvable third parties.
# recursion_artifacts is a sibling test helper imported by bare name through
# the bazel runfiles tree, so it is not importable from a plain checkout.
[mypy-frx.*,frxlib.*,zk_dtypes.*,zkbench.*,absl.*,zorch.*,recursion_artifacts]
ignore_missing_imports = True
